name: Build the Project

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # setup
    - name: Checkout project sources
      uses: actions/checkout@v5
      with:
        lfs: true  # Enable Git LFS for large files
    
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
    
    - name: Install NDK
      run: echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
    
    - name: Set NDK Path
      run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/21.4.7075529" >> $GITHUB_ENV

    # Build without validation (skip problematic tasks)
    - name: Build 'Lite' and 'Full' APK variants
      run: ./gradlew assembleLiteRelease assembleFullRelease -x validateLanguages -x buildDictionaryDownloads -x lint
    
    # Upload APKs as artifacts
    - name: Upload Lite Release APK
      uses: actions/upload-artifact@v4
      with:
        name: tt9-lite-release
        path: app/build/outputs/apk/lite/release/*.apk
        retention-days: 30
    
    - name: Upload Full Release APK
      uses: actions/upload-artifact@v4
      with:
        name: tt9-full-release
        path: app/build/outputs/apk/full/release/*.apk
        retention-days: 30
