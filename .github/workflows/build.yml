name: Build the Project

on:
  workflow_dispatch:  # Manual trigger only - run from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # setup
    - name: Checkout project sources
      uses: actions/checkout@v5
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    # validate and build
    - name: Generate Documents
      run: ./gradlew generateDocs
    - name: Validate Dictionaries
      run: ./gradlew validateLanguages
    - name: Build Languages
      run: ./gradlew buildDefinition buildDictionaryDownloads
    - name: Copy Downloads
      run: ./gradlew copyDownloadsToAssets
    - name: Lint
      run: ./gradlew lint
    - name: Build 'Lite' and 'Full' APK variants
      run: ./gradlew assembleLiteRelease assembleFullRelease
    
    # Upload APKs as artifacts
    - name: Upload Lite Release APK
      uses: actions/upload-artifact@v4
      with:
        name: tt9-lite-release
        path: app/build/outputs/apk/lite/release/*.apk
        retention-days: 30
    
    - name: Upload Full Release APK
      uses: actions/upload-artifact@v4
      with:
        name: tt9-full-release
        path: app/build/outputs/apk/full/release/*.apk
        retention-days: 30
